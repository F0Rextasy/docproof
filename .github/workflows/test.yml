name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: contract tests
        run: python -m unittest discover -s tests -v
      - name: verify our own docs tell the truth
        run: python scripts/docproof README.md SKILL.md references --strict --no-color
      - name: the broken fixture must be caught
        run: |
          python scripts/docproof examples/broken.md --no-color || test $? -eq 1
